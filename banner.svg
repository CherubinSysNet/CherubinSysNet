<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Dégradé de fond -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#12161C"/>
    </linearGradient>

    <!-- Dégradé de bordure néon -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8FF3D" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#A6A9AD" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C8FF3D" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Motif de grille discrète -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#A6A9AD" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Fond principal -->
  <rect width="896" height="256" x="2" y="2" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2"/>
  <rect width="896" height="256" x="2" y="2" rx="12" fill="url(#grid)"/>

  <!-- Barre supérieure type terminal -->
  <circle cx="30" cy="28" r="5" fill="#C8FF3D" opacity="0.9"/>
  <circle cx="48" cy="28" r="5" fill="#A6A9AD" opacity="0.4"/>
  <circle cx="66" cy="28" r="5" fill="#A6A9AD" opacity="0.2"/>
  <line x1="2" y1="48" x2="898" y2="48" stroke="#A6A9AD" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Prompt terminal en haut à droite -->
  <text x="860" y="32" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#A6A9AD" opacity="0.6" text-anchor="end">cherubin@sysnet:~$ status --active</text>

  <!-- Titre Principal -->
  <text x="50" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif" font-weight="900" font-size="38" fill="#F7F7F5" letter-spacing="2">
    CHÉRUBIN <tspan fill="#C8FF3D">TSHIENDA</tspan>
  </text>

  <!-- Sous-titre -->
  <text x="52" y="146" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="600" font-size="14" fill="#C8FF3D" letter-spacing="1.5">
    SYSTEMS &amp; NETWORK ADMINISTRATOR  |  AUTOMATION &amp; INFRASTRUCTURE
  </text>

  <!-- Badges de technologies (2 lignes) -->
  <g transform="translate(52, 168)" font-family="monospace" font-size="10.5" text-anchor="middle">
    <!-- Ligne 1 : Systèmes & Réseau -->
    <rect width="102" height="22" rx="6" fill="#0B0D10" stroke="#C8FF3D" stroke-width="1"/>
    <text x="51" y="15" fill="#F7F7F5">LINUX &amp; WIN</text>

    <rect x="110" width="80" height="22" rx="6" fill="#0B0D10" stroke="#A6A9AD" stroke-width="1" stroke-opacity="0.4"/>
    <text x="150" y="15" fill="#A6A9AD">NETWORK</text>

    <rect x="198" width="94" height="22" rx="6" fill="#0B0D10" stroke="#A6A9AD" stroke-width="1" stroke-opacity="0.4"/>
    <text x="245" y="15" fill="#A6A9AD">POWERSHELL</text>

    <rect x="300" width="58" height="22" rx="6" fill="#0B0D10" stroke="#A6A9AD" stroke-width="1" stroke-opacity="0.4"/>
    <text x="329" y="15" fill="#A6A9AD">BASH</text>

    <!-- Ligne 2 : Automatisation & Cloud -->
    <rect y="28" width="76" height="22" rx="6" fill="#0B0D10" stroke="#A6A9AD" stroke-width="1" stroke-opacity="0.4"/>
    <text x="38" y="43" fill="#A6A9AD">ANSIBLE</text>

    <rect x="84" y="28" width="90" height="22" rx="6" fill="#0B0D10" stroke="#A6A9AD" stroke-width="1" stroke-opacity="0.4"/>
    <text x="129" y="43" fill="#A6A9AD">TERRAFORM</text>

    <rect x="182" y="28" width="72" height="22" rx="6" fill="#0B0D10" stroke="#A6A9AD" stroke-width="1" stroke-opacity="0.4"/>
    <text x="218" y="43" fill="#A6A9AD">DOCKER</text>

    <rect x="262" y="28" width="100" height="22" rx="6" fill="#0B0D10" stroke="#A6A9AD" stroke-width="1" stroke-opacity="0.4"/>
    <text x="312" y="43" fill="#A6A9AD">KUBERNETES</text>

    <rect x="370" y="28" width="70" height="22" rx="6" fill="#0B0D10" stroke="#A6A9AD" stroke-width="1" stroke-opacity="0.4"/>
    <text x="405" y="43" fill="#A6A9AD">PYTHON</text>
  </g>

  <!-- Décoration graphique réseau (côté droit) -->
  <g transform="translate(730, 90)" stroke="#C8FF3D" stroke-width="1.5" fill="none">
    <circle cx="50" cy="50" r="18" stroke="#C8FF3D" stroke-dasharray="3,3"/>
    <circle cx="50" cy="50" r="8" fill="#C8FF3D"/>
    <line x1="50" y1="32" x2="50" y2="0" stroke="#A6A9AD" stroke-opacity="0.4"/>
    <line x1="68" y1="50" x2="105" y2="50" stroke="#A6A9AD" stroke-opacity="0.4"/>
    <line x1="32" y1="50" x2="0" y2="50" stroke="#A6A9AD" stroke-opacity="0.4"/>
    <line x1="50" y1="68" x2="50" y2="100" stroke="#A6A9AD" stroke-opacity="0.4"/>
    <circle cx="50" cy="0" r="4" fill="#0B0D10" stroke="#C8FF3D"/>
    <circle cx="105" cy="50" r="4" fill="#0B0D10" stroke="#C8FF3D"/>
    <circle cx="0" cy="50" r="4" fill="#0B0D10" stroke="#C8FF3D"/>
    <circle cx="50" cy="100" r="4" fill="#0B0D10" stroke="#C8FF3D"/>
  </g>
</svg>
